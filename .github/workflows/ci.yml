name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation links and website syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check documentation and website links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          # Validate local targets/anchors, including links to docs not yet on main.
          args: >-
            --offline --include-fragments --no-progress
            --root-dir '${{ github.workspace }}/website'
            --remap '^https://github\.com/mdelapenya/biomelab/blob/main/ file://${{ github.workspace }}/'
            '*.md' 'docs/**/*.md' '.claude/**/*.md' 'website/**/*.html'
      - name: Check website JavaScript syntax
        run: node --check website/js/main.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.3

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1.1.0

      - name: Test
        run: task test-race

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: package
            verify: |
              mkdir -p /tmp/verify
              # fyne tools v1.7.1 wraps the tarball in a top-level
              # directory (fyne-io/tools#105) — strip it.
              tar -xJf bin/Biomelab.tar.xz -C /tmp/verify --strip-components=1
              /tmp/verify/usr/local/bin/biomelab --version
          - os: macos-latest
            task: package-darwin-universal
            verify: task verify-darwin-universal
          - os: windows-latest
            task: package
            verify: ./bin/Biomelab.exe --version
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1.1.0

      - name: Test Windows background process behavior
        if: runner.os == 'Windows'
        run: |
          go test -race ./internal/command ./internal/terminal
          go build -o bin/focus-trace.exe ./cmd/helpers/focus-trace

      - name: Package on ${{ matrix.os }}
        run: task ${{ matrix.task }}

      - name: Verify ${{ matrix.os }} package
        run: ${{ matrix.verify }}
